name: CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Audit dependencies for known vulnerabilities
      # Non-blocking for now: 4 known high-severity findings remain in `next`/`nodemailer`
      # transitive deps that only resolve via major-version bumps (breaking changes) —
      # tracked in .kiro/steering/soc2-status.md and docs/policies/vulnerability-management-policy.md
      # rather than silently forced here. Flip `continue-on-error` to `false` once that
      # backlog is cleared, so new vulnerabilities start failing the build.
      run: npm audit --audit-level=high
      continue-on-error: true
    - name: Generate Prisma Client
      run: npx prisma generate
    - name: Lint
      run: npm run lint
    - name: Typecheck
      run: npm run typecheck
    - name: Build
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
        DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

  # main -> the existing VPS, kept as staging.
  deploy-staging:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image-tag: staging
    secrets: inherit

  # production branch -> the new VPS. Promote by merging main into production
  # once a change has been verified on staging.
  deploy-production:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image-tag: latest
    secrets: inherit
