name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Generate Prisma Client
      run: pnpm prisma generate
    - name: Lint
      run: pnpm run lint
    - name: Typecheck
      run: pnpm run typecheck
    - name: Build
      run: pnpm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
        DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        source: "scripts/*,docker-compose.prod.yml,Dockerfile.prod,next.config.ts,package*.json,prisma/*,src/*,public/*,tsconfig.json,postcss.config.mjs,eslint.config.mjs"
        target: ${{ secrets.APP_DIR }}

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
        SEED_ADMIN_NAME: ${{ secrets.SEED_ADMIN_NAME }}
        SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        envs: DATABASE_URL,OPENAI_API_KEY,SEED_ADMIN_EMAIL,SEED_ADMIN_NAME,SEED_ADMIN_PASSWORD,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,NEXT_PUBLIC_APP_URL
        script: |
          cd ${{ secrets.APP_DIR }}
          chmod +x scripts/*.sh
          cat <<EOF > .env.production
          DATABASE_URL=$DATABASE_URL
          OPENAI_API_KEY=$OPENAI_API_KEY
          SEED_ADMIN_EMAIL=$SEED_ADMIN_EMAIL
          SEED_ADMIN_NAME=$SEED_ADMIN_NAME
          SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL
          EOF
          ./scripts/deploy.sh "${{ secrets.APP_DIR }}"
