name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Generate Prisma Client
      run: npx prisma generate
    - name: Lint
      run: npm run lint
    - name: Typecheck
      run: npm run typecheck
    - name: Build
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
        DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        source: "scripts/*,docker-compose.prod.yml,Dockerfile.prod,next.config.ts,package*.json,prisma/*,src/*,public/*,tsconfig.json,postcss.config.mjs,eslint.config.mjs"
        target: ${{ secrets.APP_DIR }}

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      env:
        ENV_FILE_CONTENTS: ${{ secrets.ENV_FILE_CONTENTS }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
        SEED_ADMIN_NAME: ${{ secrets.SEED_ADMIN_NAME }}
        SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        BOOKING_EMAIL_FROM: ${{ secrets.BOOKING_EMAIL_FROM }}
        BOOKING_NOTIFY_EMAIL: ${{ secrets.BOOKING_NOTIFY_EMAIL }}
        RETELL_API_KEY: ${{ secrets.RETELL_API_KEY }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        envs: ENV_FILE_CONTENTS,DATABASE_URL,OPENAI_API_KEY,SEED_ADMIN_EMAIL,SEED_ADMIN_NAME,SEED_ADMIN_PASSWORD,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,NEXT_PUBLIC_APP_URL,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,BOOKING_EMAIL_FROM,BOOKING_NOTIFY_EMAIL,RETELL_API_KEY
        script: |
          cd ${{ secrets.APP_DIR }}
          chmod +x scripts/*.sh
          if [ -n "$ENV_FILE_CONTENTS" ]; then
            printf '%s\n' "$ENV_FILE_CONTENTS" > .env.production
          else
            printf '%s\n' \
              "DATABASE_URL=${DATABASE_URL}" \
              "OPENAI_API_KEY=${OPENAI_API_KEY}" \
              "SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}" \
              "SEED_ADMIN_NAME=${SEED_ADMIN_NAME}" \
              "SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}" \
              "POSTGRES_USER=${POSTGRES_USER}" \
              "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
              "POSTGRES_DB=${POSTGRES_DB}" \
              "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}" \
              "SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}" \
              "SMTP_PORT=${SMTP_PORT:-587}" \
              "SMTP_USER=${SMTP_USER}" \
              "SMTP_PASSWORD=${SMTP_PASSWORD}" \
              "BOOKING_EMAIL_FROM=${BOOKING_EMAIL_FROM}" \
              "BOOKING_NOTIFY_EMAIL=${BOOKING_NOTIFY_EMAIL}" \
              "RETELL_API_KEY=${RETELL_API_KEY}" \
              > .env.production
          fi
          if [ -n "$RETELL_API_KEY" ]; then
            if grep -q '^RETELL_API_KEY=' .env.production 2>/dev/null; then
              sed -i "s|^RETELL_API_KEY=.*|RETELL_API_KEY=${RETELL_API_KEY}|" .env.production
            else
              printf '%s\n' "RETELL_API_KEY=${RETELL_API_KEY}" >> .env.production
            fi
          fi
          ./scripts/deploy.sh "${{ secrets.APP_DIR }}"
