name: Deploy

# Reusable across environments — called once per environment from pipeline.yml.
# The `environment:` on the job below is what makes GitHub resolve this
# environment's own secrets (falling back to repo-level secrets for anything
# not overridden at the environment level).
on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment to deploy to (staging / production)"
        required: true
        type: string
      image-tag:
        description: "Primary image tag (e.g. staging / latest)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    # This repo's default Actions workflow permissions only grant `packages: read`
    # to the ambient GITHUB_TOKEN, so pushing needs an explicit credential instead
    # of `packages: write` in `permissions:` above (that gets rejected at workflow-
    # validation time — see the error this replaced). Reuses GHCR_PAT/GHCR_USER,
    # the same credential the server uses to pull — just scoped to also allow
    # write:packages, not read:packages only.
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ secrets.GHCR_USER }}
        password: ${{ secrets.GHCR_PAT }}

    # Built once here (CI has plenty of RAM/CPU) instead of running `next build`
    # on the production VPS during every deploy — that used to be the single
    # biggest memory-pressure moment in the whole deploy lifecycle.
    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.prod
        push: true
        tags: |
          ghcr.io/reviewrise/ai-assistant-app:${{ inputs.image-tag }}
          ghcr.io/reviewrise/ai-assistant-app:${{ inputs.image-tag }}-${{ github.sha }}
        build-args: |
          NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN }}

    # scp-action only uploads/overwrites — it does not delete files removed from the repo.
    # The image now carries src/prisma/public/etc., so the server only needs the compose
    # file + host-side scripts. Wipe the old fully-synced tree so stale files can't linger.
    - name: Clean remote synced directories
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          cd ${{ secrets.APP_DIR }}
          rm -rf src scripts deploy
          mkdir -p scripts deploy

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        source: "scripts/*,deploy/*,docker-compose.prod.yml"
        target: ${{ secrets.APP_DIR }}

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.5
      env:
        GHCR_USER: ${{ secrets.GHCR_USER }}
        GHCR_PAT: ${{ secrets.GHCR_PAT }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        ENV_FILE_CONTENTS: ${{ secrets.ENV_FILE_CONTENTS }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
        SEED_ADMIN_NAME: ${{ secrets.SEED_ADMIN_NAME }}
        SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        BOOKING_EMAIL_FROM: ${{ secrets.BOOKING_EMAIL_FROM }}
        BOOKING_NOTIFY_EMAIL: ${{ secrets.BOOKING_NOTIFY_EMAIL }}
        RETELL_API_KEY: ${{ secrets.RETELL_API_KEY }}
        RETELL_USE_CUSTOM_LLM: ${{ secrets.RETELL_USE_CUSTOM_LLM }}
        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        RETELL_CUSTOM_LLM_WS_URL: ${{ secrets.RETELL_CUSTOM_LLM_WS_URL }}
        BILLING_API_URL: ${{ secrets.BILLING_API_URL }}
        BILLING_API_KEY: ${{ secrets.BILLING_API_KEY }}
        BILLING_PRODUCT_NAME: ${{ secrets.BILLING_PRODUCT_NAME }}
        BILLING_ADMIN_URL: ${{ secrets.BILLING_ADMIN_URL }}
        TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
        VYNTRISE_WEBHOOK_SECRET: ${{ secrets.VYNTRISE_WEBHOOK_SECRET }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        envs: GHCR_USER,GHCR_PAT,SENTRY_DSN,IMAGE_TAG,ENV_FILE_CONTENTS,DATABASE_URL,OPENAI_API_KEY,SEED_ADMIN_EMAIL,SEED_ADMIN_NAME,SEED_ADMIN_PASSWORD,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,NEXT_PUBLIC_APP_URL,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,BOOKING_EMAIL_FROM,BOOKING_NOTIFY_EMAIL,RETELL_API_KEY,RETELL_USE_CUSTOM_LLM,OPENAI_MODEL,RETELL_CUSTOM_LLM_WS_URL,BILLING_API_URL,BILLING_API_KEY,BILLING_PRODUCT_NAME,BILLING_ADMIN_URL,TOKEN_ENCRYPTION_KEY,HEALTH_CHECK_TOKEN,VYNTRISE_WEBHOOK_SECRET
        script: |
          cd ${{ secrets.APP_DIR }}
          chmod +x scripts/*.sh
          if [ -n "$ENV_FILE_CONTENTS" ]; then
            printf '%s\n' "$ENV_FILE_CONTENTS" > .env.production
          else
            printf '%s\n' \
              "DATABASE_URL=${DATABASE_URL}" \
              "OPENAI_API_KEY=${OPENAI_API_KEY}" \
              "SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}" \
              "SEED_ADMIN_NAME=${SEED_ADMIN_NAME}" \
              "SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}" \
              "POSTGRES_USER=${POSTGRES_USER}" \
              "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
              "POSTGRES_DB=${POSTGRES_DB}" \
              "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}" \
              "SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}" \
              "SMTP_PORT=${SMTP_PORT:-587}" \
              "SMTP_USER=${SMTP_USER}" \
              "SMTP_PASSWORD=${SMTP_PASSWORD}" \
              "BOOKING_EMAIL_FROM=${BOOKING_EMAIL_FROM}" \
              "BOOKING_NOTIFY_EMAIL=${BOOKING_NOTIFY_EMAIL}" \
              "RETELL_API_KEY=${RETELL_API_KEY}" \
              "RETELL_USE_CUSTOM_LLM=${RETELL_USE_CUSTOM_LLM}" \
              "OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}" \
              "BILLING_API_URL=${BILLING_API_URL:-https://billing.vyntrise.com/api/v1}" \
              "BILLING_API_KEY=${BILLING_API_KEY}" \
              "BILLING_PRODUCT_NAME=${BILLING_PRODUCT_NAME:-agents}" \
              "BILLING_ADMIN_URL=${BILLING_ADMIN_URL:-https://billing.vyntrise.com}" \
              > .env.production
          fi
          merge_env_var() {
            local key="$1"
            local val="$2"
            if [ -z "$val" ]; then return 0; fi
            if grep -q "^${key}=" .env.production 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env.production
            else
              printf '%s\n' "${key}=${val}" >> .env.production
            fi
          }
          if [ "${{ inputs.environment }}" = "production" ]; then
            RETELL_USE_CUSTOM_LLM=true
            RETELL_CUSTOM_LLM_WS_URL=wss://agentllm.vyntrise.com/llm-websocket
          fi
          merge_env_var RETELL_API_KEY "$RETELL_API_KEY"
          merge_env_var RETELL_USE_CUSTOM_LLM "$RETELL_USE_CUSTOM_LLM"
          merge_env_var OPENAI_MODEL "$OPENAI_MODEL"
          merge_env_var RETELL_CUSTOM_LLM_WS_URL "$RETELL_CUSTOM_LLM_WS_URL"
          merge_env_var BILLING_API_URL "$BILLING_API_URL"
          merge_env_var BILLING_API_KEY "$BILLING_API_KEY"
          merge_env_var BILLING_PRODUCT_NAME "$BILLING_PRODUCT_NAME"
          merge_env_var BILLING_ADMIN_URL "$BILLING_ADMIN_URL"
          merge_env_var TOKEN_ENCRYPTION_KEY "$TOKEN_ENCRYPTION_KEY"
          merge_env_var HEALTH_CHECK_TOKEN "$HEALTH_CHECK_TOKEN"
          merge_env_var VYNTRISE_WEBHOOK_SECRET "$VYNTRISE_WEBHOOK_SECRET"
          merge_env_var NEXT_PUBLIC_SENTRY_DSN "$SENTRY_DSN"
          # IMAGE_TAG is NOT written to .env.production — docker-compose.prod.yml's
          # ${IMAGE_TAG:-latest} substitution reads the actual shell environment
          # (already exported by this step's `envs:`), not env_file contents.
          ./scripts/deploy.sh "${{ secrets.APP_DIR }}"
