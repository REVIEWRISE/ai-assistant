services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ai_assistant_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    command: sh -c "sh scripts/db-sync.sh && node server.js"
    ports:
      - "3015:3000"
    volumes:
      - ./data/uploads:/app/public/uploads
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"X-Health-Token: $${HEALTH_CHECK_TOKEN}\" http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  retell-llm:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ai_assistant_retell_llm
    restart: unless-stopped
    profiles:
      - retell-custom-llm
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    command: node dist/retell-custom-llm-server.js
    ports:
      - "3017:3001"
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  postgres:
    image: postgres:16-alpine
    container_name: ai_assistant_postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

volumes:
  postgres_data:

