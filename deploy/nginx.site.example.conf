# Nginx site snippet — proxy Next.js app + Retell Custom LLM WebSocket on one domain.
#
# 1. Copy to your server, e.g. /etc/nginx/sites-available/ai-assistant
# 2. Replace YOUR_DOMAIN with your hostname
# 3. Ensure docker-compose.prod exposes app on 3015 and retell-llm on 3017
# 4. sudo ln -s /etc/nginx/sites-available/ai-assistant /etc/nginx/sites-enabled/
# 5. sudo certbot --nginx -d YOUR_DOMAIN
# 6. sudo nginx -t && sudo systemctl reload nginx
#
# In .env.production:
#   RETELL_USE_CUSTOM_LLM=true
#   NEXT_PUBLIC_APP_URL=https://YOUR_DOMAIN
# (RETELL_CUSTOM_LLM_WS_URL is optional — defaults to wss://YOUR_DOMAIN/llm-websocket)

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    client_max_body_size 20M;

    # Retell Custom LLM WebSocket (OpenAI-backed live calls)
    location /llm-websocket/ {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Next.js app (HTTP + Retell webhooks/tools)
    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
